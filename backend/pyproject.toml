[project]
name = "local-slm-playwriting"
version = "0.1.0"
description = "Local SLM-based multi-agent system for generating theatre plays."
requires-python = ">=3.11"
dependencies = [
    "ollama",
    "pydantic>=2",
    "fastapi[standard]",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
