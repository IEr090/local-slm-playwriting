[project]
name = "local-slm-playwriting"
version = "0.1.0"
description = "Local SLM-based multi-agent system for generating theatre plays."
requires-python = ">=3.11"
dependencies = [
    "ollama",
    "pydantic>=2",
    "fastapi[standard]",
    "pydantic-settings>=2.15.0",
    "langgraph>=1.2.15",
    "typst>=0.15.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pypdf>=7.0.1",
]

[tool.setuptools.package-data]
"anton.infrastructure.pdf" = ["play.typ", "fonts/*"]
